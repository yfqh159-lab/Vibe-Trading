name: Sync upstream (preserve fork commits)

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'yfqh159-lab/Vibe-Trading'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the fork with workflow-capable credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Merge upstream main while preserving fork changes
        env:
          UPSTREAM_REPOSITORY: HKUDS/Vibe-Trading
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork main already contains upstream/main."
            exit 0
          fi

          fork_before=$(git rev-parse HEAD)
          upstream_head=$(git rev-parse upstream/main)
          git merge --no-commit --no-ff -X ours upstream/main

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain; refusing to push." >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git commit -m "chore(sync): merge upstream main [skip ci]"
          git push origin HEAD:main

          {
            echo "### Upstream sync"
            echo "- Fork before: \`${fork_before}\`"
            echo "- Upstream head: \`${upstream_head}\`"
            echo "- Fork after: \`$(git rev-parse HEAD)\`"
            echo "- Conflict policy: preserve fork side for overlapping hunks"
          } >> "$GITHUB_STEP_SUMMARY"
