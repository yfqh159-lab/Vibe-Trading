name: Sync upstream (preserve fork commits)

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'yfqh159-lab/Vibe-Trading'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the fork with workflow-capable credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Merge upstream main into the fork
        env:
          UPSTREAM_REPOSITORY: HKUDS/Vibe-Trading
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork main already contains upstream/main."
            exit 0
          fi

          git merge --no-edit --no-ff upstream/main
          git push origin HEAD:main
